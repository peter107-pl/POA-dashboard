<title>Limitless Essentials POA – team review</title>
<style>
  :root { --grad: linear-gradient(100deg, #3cc8f0 0%, #2f7fe8 35%, #7b4fe0 70%, #c74ad8 100%); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f6f9; color: #16161d; }
  .box { width: min(100%, 24rem); background: #fff; border: 1px solid #e4e4ea; border-radius: 1rem; padding: 2rem 1.75rem;
    box-shadow: 0 10px 30px rgba(20, 20, 40, .08); position: relative; overflow: hidden; }
  .box::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--grad); }
  h1 { margin: 0 0 .25rem; font-size: 1.25rem; letter-spacing: -.01em; }
  h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 0 0 1.25rem; color: #62626e; font-size: .9rem; line-height: 1.45; }
  label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: .375rem; }
  input { width: 100%; height: 2.75rem; border: 1px solid #d6d6de; border-radius: .6rem; padding: 0 .85rem; font: inherit; }
  input:focus { outline: none; border-color: #7b4fe0; box-shadow: 0 0 0 3px rgba(123, 79, 224, .25); }
  button { margin-top: .9rem; width: 100%; height: 2.75rem; border: 0; border-radius: .6rem; background: var(--grad);
    color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .err { color: #c0264b; font-size: .85rem; min-height: 1.2em; margin-top: .6rem; }
  .remember { display: flex; gap: .5rem; align-items: center; margin-top: .75rem; font-size: .8rem; color: #62626e; font-weight: 400; }
  .remember input { width: auto; height: auto; }
</style>
</head>

</form>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(BLOB.salt), iterations: BLOB.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function openWith(key) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BLOB.iv) }, key, b64(BLOB.ct));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
// A key remembered on this device only works for the snapshot it was saved with (each build uses a new salt).
(async () => {
  try {
    const saved = JSON.parse(localStorage.getItem('poa-key') || 'null');
    if (saved && saved.salt === BLOB.salt && saved.until > Date.now()) {
      const key = await crypto.subtle.importKey('raw', b64(saved.k), 'AES-GCM', false, ['decrypt']);
      await openWith(key);
    }
  } catch (e) { try { localStorage.removeItem('poa-key'); } catch (_) {} }
})();
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const key = await keyFrom(document.getElementById('pw').value);
    if (document.getElementById('keep').checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
      try { localStorage.setItem('poa-key', JSON.stringify({ salt: BLOB.salt, k: btoa(String.fromCharCode(...raw)), until: Date.now() + 7 * 864e5 })); } catch (_) {}
    }
    await openWith(key);
  } catch (x) {
    err.textContent = 'Wrong password. Please try again.';
    btn.disabled = false;
  }
});
</script>
